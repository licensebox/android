# Builds the signed app when a release is published, and attaches it and
# its SHA-256 sum. The tag must be v followed by the app's versionName.
name: release
on:
  release:
    types: [published]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Android platform 37
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-37.0" > /dev/null
      - name: Check the tag is the version
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          version=$(sed -n 's/^ *versionName = "\(.*\)"/\1/p' app/build.gradle.kts)
          [ "$TAG" = "v$version" ] || { echo "tag $TAG is not v$version (app/build.gradle.kts)"; exit 1; }
      - name: Signing key
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          [ -n "$KEYSTORE" ] || { echo "the signing secrets are not set"; exit 1; }
          echo "$KEYSTORE" | base64 -d > "$RUNNER_TEMP/release.jks"
          printf 'storeFile=%s\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' \
            "$RUNNER_TEMP/release.jks" "$PASSWORD" "$ALIAS" "$PASSWORD" > keystore.properties
      - name: Test and build
        run: ./gradlew :app:testDebugUnitTest :app:assembleRelease
      - name: Check the signature, and gather
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          apk=app/build/outputs/apk/release/app-release.apk
          apksigner=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)/apksigner
          "$apksigner" verify --print-certs "$apk" | grep 'SHA-256'
          mkdir dist
          cp "$apk" "dist/licensebox-android-$TAG.apk"
          (cd dist && sha256sum *.apk > SHA256SUMS)
      - name: Attach
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "$TAG" dist/* --clobber
      - name: Forget the key
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks" keystore.properties
